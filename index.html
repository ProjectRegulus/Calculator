  profitability: { minimumJobPrice:120, minimumHourlyRevenue:40, laborCostPerHour:22.5, overheadPercent:0.25, targetMargin:0.25, minimumPostConstructionPrice:450, minimumCommercialVisit:150,

/** Post-construction engine — separate from residential tables. */

/** Property Management — cost-plus rate derived from the company's own profitability settings when a rate is unconfigured (0). */
function pmDerivedRate(cfg){ const p = cfg.profitability; return Math.max(p.laborCostPerHour*(1+p.overheadPercent)/(1-Math.min(p.targetMargin,.9)), p.minimumHourlyRevenue); }
const PM_FREQ_OCC = { daily:null, weekly:4.33, biWeekly:2.17, monthly:1, asNeeded:0 };
function pmSuggestedHoursPerVisit(cfg, pm){ const c = cfg.propertyManagementPricing.community; let m=0; for(const a of Object.keys(pm.areas||{})) if(pm.areas[a]) m += c.areaMinutesPerVisit[a]||0; m += Math.max(0,num(pm.units))*c.unitMinutesPerVisit; return Math.max(1, Math.ceil(m/60*2)/2); }
/** Property-management add-ons: priced by their configured method; unpriced / customQuote items are reported as "additional quote required". */
function calculatePmAddons(cfg, pm, factors){ const lines=[], quoteRequired=[]; let total=0, review=[];

    if(a.pricingType==='customQuote' || !(unit>0)){ quoteRequired.push(a.id); continue; }
    const amount = unit*qty*factors.state*factors.market; lines.push({ id:a.id, name:a.name, qty, amount:r2(amount), pricingType:a.pricingType }); total+=amount; }

/** Property Management engine branch. Returns {status, servicePrice, laborHours, meta, lines, ...}. */
function calculatePropertyManagementPrice(cfg, q, factors){

function validateQuote(cfg, q){ const e=[]; if(!q.service||!cfg.services[q.service]?.active) e.push('service'); if(!q.state) e.push('state');
  if(q.service!=='postConstruction'&&q.service!=='commercial'&&q.service!=='propertyManagement'){ if(q.tierIndex==null&&!(num(q.exactSqFt)>0)) e.push('sqft'); if(q.tierIndex==='over'&&!(num(q.exactSqFt)>5000)) e.push('exactSqFt'); }
  if(q.service==='standard'&&!q.frequency) e.push('frequency'); if(q.service==='moveInOut'&&!q.moveType) e.push('moveType');
  if(q.service==='postConstruction'){ if(!(num(q.exactSqFt)>0)) e.push('sqft'); if(!q.pc?.projectType) e.push('projectType'); if(!q.pc?.phase) e.push('phase'); if(!q.pc?.condition) e.push('condition'); }
  if(q.service==='commercial'){ if(!(num(q.exactSqFt)>0)) e.push('sqft'); if(!q.commercial?.visitsPerWeek) e.push('frequency'); }
  if(q.service==='propertyManagement'){ const pm=q.pm||{}; if(!pm.type) e.push('pmType');
      if(pm.type==='community'||pm.type==='addOnServices'){ if(!pm.propertyType) e.push('pmPropertyType'); if(!(num(pm.units)>0)) e.push('pmUnits'); }
      if(pm.type==='community'){ if(!pm.frequency) e.push('pmFrequency'); if(pm.frequency==='custom'&&!(num(pm.daysPerWeek)>=1&&num(pm.daysPerWeek)<=7)) e.push('pmDays'); if(!Object.values(pm.areas||{}).some(Boolean)) e.push('pmAreas'); if(!(num(pm.cleaners)>=1)) e.push('pmCleaners'); if(!(num(pm.hoursPerDay)>0)) e.push('pmHoursPerDay'); }
      if(pm.type==='turnover'){ if(!pm.unitType) e.push('pmUnitType'); if(!(num(pm.bedrooms)>=0)||pm.bedrooms==='') e.push('pmBedrooms'); if(!(num(pm.bathrooms)>0)) e.push('pmBathrooms'); if(!pm.turnType) e.push('pmTurnType'); if(!pm.condition) e.push('pmCondition'); }
      if(pm.type==='dayPorter'){ if(!pm.propertyType) e.push('pmPropertyType'); if(!pm.hoursPerWeek) e.push('pmHours'); if(pm.hoursPerWeek==='custom'&&!(num(pm.customHours)>0)) e.push('pmCustomHours'); }
      for(const a of cfg.propertyManagementPricing.addOns){ const sel=pm.addOns?.[a.id]; if(sel?.on && ['perWindow','perSqFt','perRoom','hourly'].includes(a.pricingType) && !(num(sel.qty)>0)) e.push('pmAddonQty'); } }

  if(q.carpet?.enabled&&cfg.carpetPricing.mode==='sqft'&&!(num(q.carpet.sqft)>0)) e.push('carpetSqFt');

/** Master calculation — follows the required 14-step order. */

  const state = calculateStateFactor(cfg,q.state), market = calculateMarketFactor(cfg,q.market), factors={state,market};
  const d = { service:q.service, stateFactor:state, marketFactor:market, lines:[] };
  let servicePrice=0, laborHours=0, unit='job', condFactor=1, tier=null;
  let pmRes=null;
  if(q.service==='propertyManagement'){
    pmRes = calculatePropertyManagementPrice(cfg,q,factors); if(pmRes.status!=='ok') return { status:pmRes.status, reasons:pmRes.reasons, summary:q };
    d.basePrice=pmRes.basePrice; d.geoAdjustment=pmRes.geoAdjustment; d.conditionAdjustment=pmRes.conditionAdjustment; d.pm=pmRes.meta; d.pmAddons=pmRes.addons; servicePrice=pmRes.servicePrice; laborHours=pmRes.laborHours; unit=pmRes.unit; condFactor=pmRes.meta.cond??1;

    + `<h3 style="margin:14px 0 8px">${A.turnover}</h3>` + tbl(null,[['Base price — apartment / condo / townhome / managed home',`<span class="row">${['apartment','condo','townhome','managedHome'].map(k=>n(`propertyManagementPricing.turnover.${k}.basePrice`,{step:5})).join('')}</span>`],['Bedroom price / bathroom price ($)',`<span class="row">${n('propertyManagementPricing.turnover.bedroomPrice',{step:5})}${n('propertyManagementPricing.turnover.bathroomPrice',{step:5})}</span>`],['Square-foot pricing — enabled / $ per sq ft',`<span class="row"><input type="checkbox" data-cfgbool="propertyManagementPricing.turnover.squareFootPricing.enabled"${tv.squareFootPricing.enabled?' checked':''}>${n('propertyManagementPricing.turnover.squareFootPricing.rate',{step:.01})}</span>`],['Turnover type × — light / standard / deep / move-out / move-in ready / heavy',`<span class="row">${['light','standard','deep','moveOut','moveInReady','heavy'].map(k=>n('propertyManagementPricing.turnover.turnoverTypeFactors.'+k,{step:.05})).join('')}</span>`],['Condition × — normal / light / moderate / heavy / very heavy',`<span class="row">${['normal','light','moderate','heavy','veryHeavy'].map(k=>n('propertyManagementPricing.turnover.conditionFactors.'+k,{step:.05})).join('')}</span>`],['Minimum job price ($)',n('propertyManagementPricing.turnover.minimumJobPrice',{step:5})],['Large unit — sq ft threshold / factor',`<span class="row">${n('propertyManagementPricing.turnover.largeUnit.sqft',{step:100})}${n('propertyManagementPricing.turnover.largeUnit.factor',{step:.05})}</span>`],['Labor estimate (used when prices are 0) — base hrs / per bedroom / per bathroom / sq ft per hour',`<span class="row">${n('propertyManagementPricing.turnover.laborHoursEstimate.base',{step:.25})}${n('propertyManagementPricing.turnover.laborHoursEstimate.perBedroom',{step:.25})}${n('propertyManagementPricing.turnover.laborHoursEstimate.perBathroom',{step:.25})}${n('propertyManagementPricing.turnover.laborHoursEstimate.sqFtPerHour',{step:10})}</span>`]])
    + `<h3 style="margin:14px 0 8px">${A.porter}</h3>` + tbl(null,[['Hourly rate ($/hr)',n('propertyManagementPricing.dayPorter.hourlyRate',{step:.5})],['Minimum weekly hours',n('propertyManagementPricing.dayPorter.minimumWeeklyHours',{step:1})],['Minimum monthly price ($)',n('propertyManagementPricing.dayPorter.minimumMonthlyPrice',{step:25})]])
    + `<h3 style="margin:14px 0 8px">${A.addons}</h3>` + tbl(['Add-on','Price','Method','Active'],c.propertyManagementPricing.addOns.map((a,i)=>[a.name,n(`propertyManagementPricing.addOns.${i}.price`,{step:.5}),sel(`propertyManagementPricing.addOns.${i}.pricingType`,{perItem:'Per item',perWindow:'Per window',perSqFt:'Per sq ft',perRoom:'Per room',perVisit:'Per visit',hourly:'Hourly',customQuote:'Custom quote'}),`<input type="checkbox" data-cfgbool="propertyManagementPricing.addOns.${i}.active"${a.active!==false?' checked':''}>`]))
    + `<h3 style="margin:14px 0 8px">${A.thresholds}</h3>` + tbl(null,[['Community — max units / max common-area sq ft / max cleaners',`<span class="row">${n('propertyManagementPricing.community.customQuote.maxUnits',{step:50})}${n('propertyManagementPricing.community.customQuote.maxCommonAreaSqFt',{step:5000})}${n('propertyManagementPricing.community.customQuote.maxCleaners',{step:1})}</span>`],['Turnover — custom quote above sq ft',n('propertyManagementPricing.turnover.customQuoteAboveSqFt',{step:250})],['Day porter — custom quote above weekly hours',n('propertyManagementPricing.dayPorter.customQuoteAboveWeeklyHours',{step:5})]]); }
  if(S.adminTab==='json') body = `<textarea class="input json" data-cfgjson="1" spellcheck="false">${esc(S.cfgJson||JSON.stringify(c,jsonOut,2))}</textarea><div class="row" style="margin-top:8px"><button type="button" class="btn btn-sm" data-action="applyJson">Apply JSON to draft</button></div>`;
  return `<section class="admin"><div class="adm-h"><div><h2>${L.title}</h2><p class="small muted">${L.hide}</p></div><div class="row">${S.adminMsg?`<span class="small" style="color:var(--ok)">${esc(S.adminMsg)}</span>`:''}<button type="button" class="btn btn-sm" data-action="resetCfg">${L.reset}</button><button type="button" class="btn btn-sm btn-primary" data-action="saveCfg">${L.save}</button><button type="button" class="btn btn-sm btn-ghost" data-action="closeAdmin">${L.close}</button></div></div><div class="tabs">${Object.entries(tabs).map(([k,l])=>`<button type="button" aria-current="${S.adminTab===k}" data-action="adminTab" data-tab="${k}">${l}</button>`).join('')}</div><div class="panel"><div class="pb">${body}</div></div></section>`; }

/* ---------------------------------------------------------------- 6. RENDER & EVENTS */
const app = document.getElementById('app');
function render(){ const L=t(); document.getElementById('brand-sub').textContent = L.sub; document.documentElement.lang = S.lang; document.querySelectorAll('.lang').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===S.lang));
  if(!S.q) S.q = newQuote(); const sc = screens(S.q), key = sc[Math.min(S.step,sc.length-1)], isResult = key==='result', errs = S.errors.map(e=>L.errs[e]||L.pm.errs[e]).filter(Boolean);
  app.innerHTML = `<div class="progress"><span>${L.progress.replace('{n}',S.step+1).replace('{t}',sc.length)}</span><span class="bar"><i style="width:${(S.step+1)/sc.length*100}%"></i></span></div>${errs.length?`<div class="err" role="alert" aria-live="assertive">${errs.map(esc).join(' ')}</div>`:''}<div data-screen="${key}">${renderScreen(key)}</div>${S.admin?renderAdmin():''}
<div class="nav"><div class="nav-in">${S.step>0?`<button type="button" class="btn btn-ghost" data-action="back">${L.back}</button>`:''}${isResult?`<button type="button" class="btn btn-primary" data-action="restart">${L.startOver}</button>`:key==='service'?'':`<button type="button" class="btn btn-primary" data-action="next">${sc[S.step+1]==='result'?L.getPrice:L.next}</button>`}</div></div>`;
  window.scrollTo({top:0}); }
const getP = (o,p) => p.split('.').reduce((a,k)=>a?.[k],o); function setP(o,p,v){ const ks=p.split('.'); let c=o; for(let i=0;i<ks.length-1;i++){ if(c[ks[i]]==null) c[ks[i]]={}; c=c[ks[i]]; } c[ks[ks.length-1]]=v; }
function next(){ const sc = screens(S.q), key = sc[S.step]; const need = { size:['sqft','exactSqFt'], sizeExact:['sqft'], frequency:['frequency'], moveType:['moveType'], condition:['condition'], commercialFrequency:['frequency'], projectType:['projectType'], phase:['phase'], pcCondition:['condition'], addons:['carpetSqFt','windowCount'], location:['state'], pmType:['pmType'], pmPropertyType:['pmPropertyType'], pmUnits:['pmUnits'], pmFrequency:['pmFrequency','pmDays'], pmAreas:['pmAreas'], pmStaffing:['pmCleaners','pmHoursPerDay'], pmUnitType:['pmUnitType'], pmUnitSize:['pmBedrooms','pmBathrooms'], pmTurnType:['pmTurnType'], pmCondition:['pmCondition'], pmHours:['pmHours','pmCustomHours'], pmAddons:['pmAddonQty'] }[key]||[];
  const all = validateQuote(cfg,S.q), errs = all.filter(e=>need.includes(e)); if(errs.length){ S.errors=errs; render(); return; } S.errors=[];
  if(sc[S.step+1]==='result'){ if(all.length){ S.errors=all; render(); return; } S.result = calculateQuote(cfg,S.q); S.sent=false; }
  S.step++; if(sc[S.step]==='pmStaffing'){ const st = cfg.propertyManagementPricing.community.staffing; if(S.q.pm.cleaners==='') S.q.pm.cleaners = st.defaultCleaners; if(S.q.pm.hoursPerDay==='') S.q.pm.hoursPerDay = Math.max(st.defaultHoursPerDay, pmSuggestedHoursPerVisit(cfg,S.q.pm)); } render(); }
document.addEventListener('click', e => {
  const lang = e.target.closest('[data-lang]'); if(lang){ S.lang = lang.dataset.lang; render(); return; }
  const set = e.target.closest('[data-set]'); if(set){ const p = set.dataset.set, v = set.dataset.value; if(v==='toggle') setP(S.q,p,!getP(S.q,p)); else { const cur = getP(S.q,p); setP(S.q,p, (/^\d+$/.test(v)&&p!=='tierIndex')?Number(v):v); if(p==='service' && cur!==v){ const svc = v; S.q = newQuote(); S.q.service = svc; } if(p==='pm.type' && cur!==v){ const keep = S.q.pm.type = v; S.q.pm = { ...newQuote().pm, type:keep }; } }
    S.errors=[]; if(set.dataset.stay||v==='toggle'||p==='tierIndex'||p.startsWith('pc.options')) render(); else next(); return; }
  const a = e.target.closest('[data-action]'); if(!a) return;
  switch(a.dataset.action){
    case 'next': next(); break; case 'back': S.errors=[]; S.step=Math.max(0,S.step-1); render(); break;
    case 'restart': S.q=newQuote(); S.step=0; S.result=null; S.errors=[]; render(); break;
    case 'allowEstimate': S.q.allowLargeEstimate=true; S.result=calculateQuote(cfg,S.q); render(); break;
    case 'adminTab': S.adminTab=a.dataset.tab; S.adminMsg=''; render(); break;
    case 'closeAdmin': S.admin=false; history.replaceState(null,'',location.pathname+location.search); render(); break;
    case 'saveCfg': saveCompanyConfig(S.cfgDraft); cfg=loadCompanyConfig('default'); S.cfgDraft=clone(cfg); S.cfgJson=''; if(S.result&&S.result.summary) S.result=calculateQuote(cfg,S.q); S.adminMsg=t().admin.saved; render(); break;
    case 'resetCfg': if(confirm('Reset pricing settings to defaults?')){ safeDel('oneapp.pricingConfig.default'); cfg=loadCompanyConfig('default'); S.cfgDraft=clone(cfg); S.cfgJson=''; if(S.result) S.result=calculateQuote(cfg,S.q); render(); } break;
    case 'applyJson': try{ S.cfgDraft = JSON.parse(S.cfgJson||document.querySelector('[data-cfgjson]').value, jsonIn); S.cfgJson=''; S.adminMsg='JSON applied to draft — save to persist.'; }catch(err){ S.adminMsg='JSON could not be parsed.'; } render(); break; }
});
document.addEventListener('input', e => { const el = e.target;
  if(el.dataset.num){ const v = el.value===''?'':Number(el.value); if(el.dataset.num.startsWith('addOns.')) setP(S.q, el.dataset.num, Math.max(1,num(v,1))); else setP(S.q, el.dataset.num, v); return; }
  if(el.dataset.text){ setP(S.q, el.dataset.text, el.value); return; }
  if(el.dataset.cfg){ const n = el.value===''?0:Number(el.value); setP(S.cfgDraft, el.dataset.cfg, Number.isFinite(n)?(el.dataset.pct?n/100:n):0); return; }
  if(el.dataset.cfgjson) S.cfgJson = el.value; });
document.addEventListener('change', e => { const el = e.target;
  if(el.dataset.sel){ setP(S.q, el.dataset.sel, el.value); return; }
  if(el.dataset.cfgsel){ setP(S.cfgDraft, el.dataset.cfgsel, el.value); render(); return; }
  if(el.dataset.cfgbool){ setP(S.cfgDraft, el.dataset.cfgbool, el.checked); return; } });
document.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.matches('input[data-num], input[data-text]') && !S.admin){ e.preventDefault(); next(); } });
document.addEventListener('submit', e => { if(e.target.dataset.form==='custom'){ e.preventDefault(); S.sent=true; /* hook: send {name, phone, email, quote: S.q} to One App CRM / GHL */ render(); } });
window.addEventListener('hashchange', () => { S.admin = location.hash==='#admin'; render(); });
render();
