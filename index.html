     2. Pricing engine       — calculateQuote() and its helper functions (no UI, no DOM)

/* Tenant hook: replace with a Supabase read later. Overrides are deep-merged over the default config. */
function loadCompanyConfig(companyId='default'){ const raw = safeGet('oneapp.pricingConfig.'+companyId); const base = clone(DEFAULT_PRICING_CONFIG); if(!raw) return base; try{ return deepMerge(base, JSON.parse(raw, jsonIn)); }catch(e){ return base; } }
function saveCompanyConfig(cfg, companyId='default'){ safeSet('oneapp.pricingConfig.'+companyId, JSON.stringify(cfg, jsonOut)); }
const jsonOut=(k,v)=>v===Infinity?'__Infinity__':v, jsonIn=(k,v)=>v==='__Infinity__'?Infinity:v, clone=o=>JSON.parse(JSON.stringify(o,jsonOut),jsonIn);
function deepMerge(b,p){ if(Array.isArray(p)) return p; if(b&&typeof b==='object'&&p&&typeof p==='object'&&!Array.isArray(b)){ const o={...b}; for(const k of Object.keys(p)) o[k]=deepMerge(b[k],p[k]); return o; } return p===undefined?b:p; }
const mem={}; function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k]??null; } } function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } } function safeDel(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }

/* ---------------------------------------------------------------- 2. PRICING ENGINE (pure functions, no DOM) */
const num = (v,d=0) => { const n = typeof v==='number'?v:Number(v); return Number.isFinite(n)?n:d; };
const r2 = n => Math.round(n*100)/100;
const TIER_LABELS = ['0–1,000','1,001–1,500','1,501–2,000','2,001–2,500','2,501–3,000','3,001–3,500','3,501–4,000','4,001–4,500','4,501–5,000'];

/** Returns {index, label, sqft, over} for a square-footage input. index 8 = last table row; over = sq ft beyond 5,000. */
function findSquareFootageTier(sqft){ const s = Math.max(0,num(sqft)); for(let i=0;i<T.length;i++) if(s<=T[i]) return { index:i, label:TIER_LABELS[i], sqft:s, over:0 }; return { index:T.length-1, label:'5,001+', sqft:s, over:s-T[T.length-1] }; }
/** State factor normalized to the company's base market. */
function calculateStateFactor(cfg, state){ const f = cfg.stateFactors, base = num(f[cfg.baseMarket],1)||1, s = num(f[(state||'').toUpperCase()],0); return s>0 ? r2(s/base*1000)/1000 : 1; }
function calculateMarketFactor(cfg, market){ const m = cfg.marketFactors||{}; const v = market ? m[String(market).toUpperCase()] : undefined; return num(v, num(m.default,1)); }
function calculateConditionFactor(cfg, condition){ return cfg.conditionFactors[condition] ?? 1; }
/** Explicit table cell first; frequency fallback only when a cell is missing. */
function calculateFrequencyPrice(cfg, tierIndex, frequency){ const t = cfg.standardPricing, cell = t[frequency]?.[tierIndex]; if(Number.isFinite(cell)) return cell; const monthly = t.monthly?.[tierIndex]; return Number.isFinite(monthly) ? monthly*(cfg.frequencyFallback[frequency]??1) : 0; }
function over5000Extra(cfg, over, key){ return over>0 ? over*(cfg.over5000.ratePerExtraSqFt[key]??0) : 0; }
function roundCustomerPrice(cfg, n){ if(!Number.isFinite(n)||n<=0) return 0; if(cfg.rounding.exactPricing) return Math.round(n); const step = cfg.rounding.step>0?cfg.rounding.step:1; return Math.round(n/step)*step; }
function estimateLaborHours(cfg, service, sqft, condition, frequency){ const p = cfg.profitability.productionSqFtPerHour; const key = service==='standard'&&frequency==='initial'?'initial':service; const rate = p[key]||p.standard; const div = (cfg.profitability.frequencyHourDivisors||{})[frequency]||1; return Math.max(1, sqft/rate/div) * (typeof condition==='number'?condition:1); }
/** Floor = max(minimum job, hours × minimum hourly revenue, cost ÷ (1 − target margin)). */
function calculateProfitabilityFloor(cfg, service, laborHours){ const p = cfg.profitability, cost = laborHours*p.laborCostPerHour*(1+p.overheadPercent); const floors=[p.minimumJobPrice, laborHours*p.minimumHourlyRevenue, cost/(1-Math.min(p.targetMargin,.9))]; if(service==='postConstruction') floors.push(p.minimumPostConstructionPrice); if(service==='commercial') floors.push(p.minimumCommercialVisit); return Math.max(...floors.map(f=>num(f))); }

function calculateWindowPrice(cfg, servicePrice, w){
  if(!w||!w.enabled) return { amount:0, method:'none' };
  const wp = cfg.windowPricing, access = wp.accessibility[w.access||'standard'];
  if(access==='review') return { amount:0, method:'review', review:'highAccessWindows' };
  if(wp.mode==='perWindow'){ const count = Math.max(0,num(w.count)), unit = wp.perWindow[w.scope==='interiorExterior'?'interiorExterior':'interior']; return { amount:count*unit*num(access,1), method:'perWindow', count, unit, access:num(access,1) }; }
  return { amount:servicePrice*wp.packagePercent*num(access,1), method:'percent', percent:wp.packagePercent, access:num(access,1) };
}
/** Carpet is priced ONLY on carpet square footage. Returns amounts per pricing tier. */
function calculateCarpetPrice(cfg, c){
  if(!c||!c.enabled) return { low:0, recommended:0, premium:0, method:'none' };
  const cp = cfg.carpetPricing, cond = cp.conditionFactors[c.condition||'normal']??1;
  if(cp.mode==='perRoom'){ const r = c.rooms||{}, amt = (num(r.room)*cp.perRoom.room+num(r.hallway)*cp.perRoom.hallway+num(r.landing)*cp.perRoom.landing+num(r.stairs)*cp.perRoom.stairs)*cond; return { low:amt, recommended:amt, premium:amt, method:'perRoom', conditionFactor:cond }; }
  const sqft = Math.max(0,num(c.sqft)); if(sqft===0) return { low:0, recommended:0, premium:0, method:'sqft', sqft:0 };
  const at = rate => Math.max(cp.minimum, sqft*rate*cond);
  return { low:at(cp.ratePerSqFt.low), recommended:at(cp.ratePerSqFt.recommended), premium:at(cp.ratePerSqFt.premium), method:'sqft', sqft, conditionFactor:cond };
}
function getApplicableAddons(cfg, service){ return cfg.addOns.filter(a=>a.active && a.applicableServices.includes(service)); }
function calculateAddons(cfg, service, selected, stateFactor, marketFactor){ const lines=[]; let total=0; for(const a of getApplicableAddons(cfg,service)){ const qty = num(selected&&selected[a.id]); if(qty<=0) continue; let amount = a.pricingType==='each'?a.price*qty:a.price; if(a.stateAdjustmentEnabled) amount*=stateFactor; if(a.marketAdjustmentEnabled) amount*=marketFactor; lines.push({ id:a.id, name:a.name, qty, amount:r2(amount) }); total+=amount; } return { total, lines }; }

/** Post-construction engine — separate from residential tables. */
function calculatePostConstructionPrice(cfg, q, factors){
  const pc = cfg.postConstructionPricing, sqft = Math.max(0,num(q.exactSqFt)), commercial = q.pc.projectType==='commercial', cq = pc.customQuote;
  const reasons=[]; if(sqft>(commercial?cq.commercialMaxSqFt:cq.residentialMaxSqFt)) reasons.push('sizeExceedsAutomatic'); if(cq.heavyResidueMultiPhase&&q.pc.condition==='heavyResidue'&&q.pc.phase==='multiPhase') reasons.push('heavyResidueMultiPhase'); if(q.pc.options.floorCare&&commercial&&sqft>cq.floorCareAboveSqFt) reasons.push('floorCareLargeProject');
  if(reasons.length) return { status:'customQuote', reasons };
  let rate, minimum; if(commercial){ const tier = pc.commercialTiers.find(t=>sqft<t[0])||pc.commercialTiers[pc.commercialTiers.length-1]; rate=tier[1]; minimum=pc.commercialMinimum; } else { rate=pc.residentialRatePerSqFt; minimum=pc.residentialMinimum; }
  const base = Math.max(minimum, sqft*rate), phase = pc.phaseFactors[q.pc.phase]??1, cond = pc.conditionFactors[q.pc.condition]??1;
  let price = base*phase*factors.state*factors.market*cond; const geo = base*phase*(factors.state*factors.market-1), condAdj = base*phase*factors.state*factors.market*(cond-1);
  const optLines=[]; for(const [k,on] of Object.entries(q.pc.options||{})){ if(!on) continue; const o = pc.options[k]; if(!o) continue; const amt = o.type==='percent'?price*o.value:o.type==='perSqFt'?Math.max(o.minimum||0,sqft*o.value):o.value; optLines.push({ id:k, amount:r2(amt) }); }
  const opts = optLines.reduce((s,l)=>s+l.amount,0);
  const hours = sqft/(commercial?cfg.profitability.productionSqFtPerHour.postConstructionCommercial:cfg.profitability.productionSqFtPerHour.postConstructionResidential)*phase*cond;
  return { status:'ok', base, rate, phase, cond, geoAdj:geo, condAdj, options:optLines, optionsTotal:opts, subtotal:price+opts, laborHours:hours };
}

function validateQuote(cfg, q){ const e=[]; if(!q.service||!cfg.services[q.service]?.active) e.push('service'); if(!q.state) e.push('state');
  if(q.service!=='postConstruction'&&q.service!=='commercial'){ if(q.tierIndex==null&&!(num(q.exactSqFt)>0)) e.push('sqft'); if(q.tierIndex==='over'&&!(num(q.exactSqFt)>5000)) e.push('exactSqFt'); }
  if(q.service==='standard'&&!q.frequency) e.push('frequency'); if(q.service==='moveInOut'&&!q.moveType) e.push('moveType');
  if(q.service==='postConstruction'){ if(!(num(q.exactSqFt)>0)) e.push('sqft'); if(!q.pc?.projectType) e.push('projectType'); if(!q.pc?.phase) e.push('phase'); if(!q.pc?.condition) e.push('condition'); }
  if(q.service==='commercial'){ if(!(num(q.exactSqFt)>0)) e.push('sqft'); if(!q.commercial?.visitsPerWeek) e.push('frequency'); }
  if(['standard','deep','moveInOut','commercial'].includes(q.service)&&!q.condition) e.push('condition');
  if(q.carpet?.enabled&&cfg.carpetPricing.mode==='sqft'&&!(num(q.carpet.sqft)>0)) e.push('carpetSqFt');
  if(q.windows?.enabled&&cfg.windowPricing.mode==='perWindow'&&!(num(q.windows.count)>0)) e.push('windowCount');
  return e; }

/** Master calculation — follows the required 14-step order. */
function calculateQuote(cfg, q){
  const errors = validateQuote(cfg,q); if(errors.length) return { status:'invalid', errors };
  const state = calculateStateFactor(cfg,q.state), market = calculateMarketFactor(cfg,q.market), factors={state,market};
  const d = { service:q.service, stateFactor:state, marketFactor:market, lines:[] };
  let servicePrice=0, laborHours=0, unit='job', condFactor=1, tier=null;
  if(q.service==='postConstruction'){
    const pc = calculatePostConstructionPrice(cfg,q,factors); if(pc.status!=='ok') return { status:'customQuote', reasons:pc.reasons, summary:q };
    d.basePrice=pc.base; d.ratePerSqFt=pc.rate; d.phaseFactor=pc.phase; d.geoAdjustment=pc.geoAdj; d.conditionAdjustment=pc.condAdj; d.pcOptions=pc.options; servicePrice=pc.subtotal; laborHours=pc.laborHours; condFactor=pc.cond;
  } else if(q.service==='commercial'){
    const cp = cfg.commercialPricing, sqft = Math.max(0,num(q.exactSqFt)), vpw = num(q.commercial.visitsPerWeek,1); if(sqft>cp.customQuoteAboveSqFt) return { status:'customQuote', reasons:['sizeExceedsAutomatic'], summary:q };
    const rate = cp.ratePerSqFtPerVisit[vpw]??cp.ratePerSqFtPerVisit[Object.keys(cp.ratePerSqFtPerVisit).sort((a,b)=>Math.abs(a-vpw)-Math.abs(b-vpw))[0]]; const base = Math.max(cp.minimumVisitPrice, sqft*rate); condFactor = calculateConditionFactor(cfg,q.condition); if(condFactor==='review') return { status:'review', reasons:['extremeCondition'], summary:q };
    d.basePrice=base; d.ratePerSqFt=rate; d.geoAdjustment=base*(state*market-1); d.conditionAdjustment=base*state*market*(condFactor-1); servicePrice=base*state*market*condFactor; laborHours=Math.max(1.5,sqft/cfg.profitability.productionSqFtPerHour.commercial)*condFactor; unit='visit'; d.visitsPerMonth=r2(vpw*cp.weeksPerMonth);
  } else {
    tier = findSquareFootageTier(q.tierIndex==='over'?q.exactSqFt:T[q.tierIndex]); if(q.tierIndex!=='over'&&q.tierIndex!=null) tier = { ...tier, index:Number(q.tierIndex), label:TIER_LABELS[q.tierIndex], sqft:T[q.tierIndex] };
    if(tier.over>0 && tier.sqft>cfg.over5000.customQuoteAboveSqFt && !q.allowLargeEstimate) return { status:'customQuote', reasons:['veryLarge'], summary:q, allowEstimate:true };
    let base, key; if(q.service==='standard'){ key=q.frequency; base=calculateFrequencyPrice(cfg,tier.index,q.frequency); if(q.frequency!=='initial') unit='visit'; }
    else if(q.service==='deep'){ key='deep'; base=cfg.deepPricing[tier.index]; }
    else { key='moveOut'; base=cfg.moveOutPricing[tier.index]*(q.moveType==='moveIn'?cfg.moveInFactor:1); }
    const extra = over5000Extra(cfg,tier.over,key); d.basePrice=base; d.over5000=extra; d.tier=tier.label;
    condFactor = calculateConditionFactor(cfg,q.condition); if(condFactor==='review') return { status:'review', reasons:['extremeCondition'], summary:q };
    const geo=(base+extra)*(state*market-1); d.geoAdjustment=geo; d.conditionAdjustment=(base+extra)*state*market*(condFactor-1); servicePrice=(base+extra)*state*market*condFactor;
    laborHours = estimateLaborHours(cfg, q.service, tier.sqft||T[tier.index], condFactor, q.frequency);
  }
  d.conditionFactor = condFactor; d.servicePrice = servicePrice;
  // STEP 8 windows (never both models)
  const win = q.service==='postConstruction' ? { amount:0, method:'pcOption' } : calculateWindowPrice(cfg, servicePrice, q.windows); if(win.method==='review') return { status:'review', reasons:[win.review], summary:q }; d.windows=win;
  // STEP 9 carpet by carpet sq ft only
  const carpet = calculateCarpetPrice(cfg, q.carpet); d.carpet=carpet;
  // STEP 10 add-ons
  const addons = calculateAddons(cfg, q.service, q.addOns, state, market); d.addons=addons;
  // STEP 11 profitability floor
  const floor = calculateProfitabilityFloor(cfg, q.service, laborHours); d.profitabilityFloor=r2(floor); d.laborHours=r2(laborHours);
  const nonCarpet = servicePrice + win.amount + addons.total; let recRaw = nonCarpet + carpet.recommended; d.floorApplied = recRaw<floor; recRaw = Math.max(recRaw, floor);
  // STEP 12–14 rounding and tiers
  const pt = cfg.pricingTiers, recommended = roundCustomerPrice(cfg, recRaw);
  const lowRaw = Math.max(recommended*pt.low - carpet.recommended + carpet.low, cfg.profitability.minimumJobPrice), premRaw = recommended*pt.premium - carpet.recommended + carpet.premium;
  const low = roundCustomerPrice(cfg, lowRaw), premium = roundCustomerPrice(cfg, premRaw);
  const sqftForRate = q.service==='postConstruction'||q.service==='commercial' ? num(q.exactSqFt) : (tier.sqft||T[tier.index]);
  d.recommended=recommended; d.low=low; d.premium=premium; d.effectivePerSqFt = sqftForRate>0 ? r2(recommended/sqftForRate) : 0;
  const monthly = unit==='visit' ? (q.service==='commercial' ? d.visitsPerMonth : ({weekly:4.33,biWeekly:2.17,monthly:1})[q.frequency]||1) : null;
  return { status:'ok', low, recommended, premium, unit, monthly: monthly ? { low:roundCustomerPrice(cfg,low*monthly), recommended:roundCustomerPrice(cfg,recommended*monthly), premium:roundCustomerPrice(cfg,premium*monthly) } : null, debug:d, summary:q };
}
const calculateRecommendedPrice = (cfg,q) => calculateQuote(cfg,q).recommended;
const calculateLowPrice = (cfg,q) => calculateQuote(cfg,q).low;
const calculatePremiumPrice = (cfg,q) => calculateQuote(cfg,q).premium;

const S = { lang:'en', step:0, q:null, result:null, errors:[], sent:false, admin: location.hash==='#admin', adminTab:'calc', adminMsg:'', cfgDraft:null, cfgJson:'' };
const t = () => I18N[S.lang];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number.isFinite(n)?'$'+Math.round(n).toLocaleString('en-US'):'$0';
function newQuote(){ return { service:null, state:cfg.baseMarket, market:'', tierIndex:null, exactSqFt:'', frequency:null, moveType:null, condition:null, pc:{ projectType:null, phase:null, condition:null, options:{} }, commercial:{ visitsPerWeek:null }, windows:{ enabled:false, scope:'interior', access:'standard', count:'' }, carpet:{ enabled:false, sqft:'', condition:'normal', rooms:{} }, addOns:{}, allowLargeEstimate:false }; }
/** Ordered screens for the selected service (progressive disclosure). */
function screens(q){ if(!q.service) return ['service']; const base = { standard:['service','size','frequency','condition','addons','location'], deep:['service','size','condition','addons','location'], moveInOut:['service','size','moveType','condition','addons','location'], postConstruction:['service','sizeExact','projectType','phase','pcCondition','pcOptions','location'], commercial:['service','sizeExact','commercialFrequency','condition','addons','location'] }; return [...base[q.service],'result']; }
const active = () => Object.keys(cfg.services).filter(s=>cfg.services[s].active);

const optBtn = (data, value, label, desc, pressed) => `<button type="button" class="opt" aria-pressed="${pressed}" data-set="${data}" data-value="${esc(value)}"><span>${esc(label)}${desc?`<span class="d">${esc(desc)}</span>`:''}</span><span class="tick">${pressed?'✓':''}</span></button>`;
const optList = (data, entries, current, cls='') => `<div class="opts ${cls}">${entries.map(([v,[l,d]])=>optBtn(data,v,l,d,String(current)===String(v))).join('')}</div>`;
function numInput(id, label, value, suffix, hint){ return `<div class="field"><label for="${id}">${esc(label)}</label><div class="affix"><input id="${id}" class="input" type="number" inputmode="numeric" min="0" data-num="${id}" value="${value===''||value==null?'':esc(value)}">${suffix?`<span>${esc(suffix)}</span>`:''}</div>${hint?`<span class="hint">${esc(hint)}</span>`:''}</div>`; }

function renderScreen(key){ const q=S.q, L=t();
  switch(key){
    case 'service': return `<div class="q">${L.q1}</div>${optList('service', active().map(s=>[s,L.services[s]]), q.service)}`;
    case 'size': { const entries = TIER_LABELS.map((l,i)=>[i,[l+' '+L.sqft,'']]); entries.push(['over',['5,001+ '+L.sqft,'']]); return `<div class="q">${L.qSize}</div>${optList('tierIndex',entries,q.tierIndex,'two')}${q.tierIndex==='over'?numInput('exactSqFt',L.exact,q.exactSqFt,L.sqft):''}`; }
    case 'sizeExact': return `<div class="q">${L.qSizeC}</div>${numInput('exactSqFt',L.exact,q.exactSqFt,L.sqft)}`;
    case 'frequency': return `<div class="q">${L.qFreq}</div>${optList('frequency',Object.entries(L.freq),q.frequency)}`;
    case 'moveType': return `<div class="q">${L.qMove}</div>${optList('moveType',Object.entries(L.move),q.moveType)}`;
    case 'condition': return `<div class="q">${q.service==='commercial'?L.qCondC:L.qCond}</div>${optList('condition',Object.entries(L.cond).filter(([k])=>cfg.conditionFactors[k]!==undefined),q.condition)}`;
    case 'commercialFrequency': return `<div class="q">${L.qCFreq}</div>${optList('commercial.visitsPerWeek',Object.keys(cfg.commercialPricing.ratePerSqFtPerVisit).map(n=>[n,[`${n}× ${L.perWeek}`,'']]),q.commercial.visitsPerWeek,'two')}`;
    case 'projectType': return `<div class="q">${L.qType}</div>${optList('pc.projectType',Object.entries(L.ptype),q.pc.projectType)}`;
    case 'phase': return `<div class="q">${L.qPhase}</div>${optList('pc.phase',Object.entries(L.phase),q.pc.phase)}`;
    case 'pcCondition': return `<div class="q">${L.qPcCond}</div>${optList('pc.condition',Object.entries(L.pcond),q.pc.condition)}`;
    case 'pcOptions': return `<div class="q">${L.qPcOpt}</div><div class="qh">${L.qAddH}</div><div class="opts two">${Object.keys(cfg.postConstructionPricing.options).map(k=>optBtn('pc.options.'+k,'toggle',L.pcopt[k],'',!!q.pc.options[k])).join('')}</div>`;
    case 'addons': { const addons = getApplicableAddons(cfg,q.service), wp = cfg.windowPricing, cp = cfg.carpetPricing, showWin = q.service!=='commercial', showCarpet = q.service!=='commercial';
      let html = `<div class="q">${L.qAdd}</div><div class="qh">${L.qAddH}</div><div class="opts">`;
      if(showWin) html += optBtn('windows.enabled','toggle',L.windows,'',q.windows.enabled) + (q.windows.enabled?`<div class="sub"><div class="t">${L.winScope}</div><div class="chips">${['interior','interiorExterior'].map(sc=>`<button type="button" class="chip" aria-pressed="${q.windows.scope===sc}" data-set="windows.scope" data-value="${sc}" data-stay="1">${sc==='interior'?L.winInterior:L.winBoth}</button>`).join('')}</div><div class="t">${L.winAccess}</div><div class="chips">${Object.keys(wp.accessibility).map(a=>`<button type="button" class="chip" aria-pressed="${q.windows.access===a}" data-set="windows.access" data-value="${a}" data-stay="1">${L.access[a]}</button>`).join('')}</div>${wp.mode==='perWindow'?numInput('windows.count',L.winCount,q.windows.count,''):''}</div>`:'');
      if(showCarpet) html += optBtn('carpet.enabled','toggle',L.carpet,'',q.carpet.enabled) + (q.carpet.enabled?`<div class="sub">${cp.mode==='sqft'?numInput('carpet.sqft',L.carpetSqFt,q.carpet.sqft,L.sqft):Object.entries(L.rooms).map(([k,l])=>numInput('carpet.rooms.'+k,l,q.carpet.rooms[k]??'','')).join('')}<div class="t">${L.carpetCond}</div><div class="chips">${Object.keys(cp.conditionFactors).map(c=>`<button type="button" class="chip" aria-pressed="${q.carpet.condition===c}" data-set="carpet.condition" data-value="${c}" data-stay="1">${L.ccond[c]}</button>`).join('')}</div></div>`:'');
      for(const a of addons){ const qty = num(q.addOns[a.id]); html += optBtn('addOns.'+a.id,'toggle',a.name,a.description,qty>0) + (qty>0&&a.pricingType==='each'?`<div class="sub"><div class="row"><span class="t">${L.qty}</span><input class="input qty" type="number" inputmode="numeric" min="1" max="50" value="${qty}" data-num="addOns.${a.id}" aria-label="${esc(a.name)} ${L.qty}"></div></div>`:''); }
      return html+'</div>'; }
    case 'location': return `<div class="q">${L.qState}</div><div class="field"><label for="state">${L.state}</label><select id="state" class="select" data-sel="state">${Object.entries(STATES).map(([k,v])=>`<option value="${k}"${q.state===k?' selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="market">${L.city}</label><input id="market" class="input" type="text" data-text="market" value="${esc(q.market)}"></div>`;
    case 'result': return renderResult();
  } return ''; }

function serviceLines(q){ const L=t(), out=[]; if(q.windows.enabled&&q.service!=='commercial') out.push(L.windows); if(q.carpet.enabled&&q.service!=='commercial') out.push(L.carpet+(q.carpet.sqft?` (${q.carpet.sqft} ${L.sqft})`:'')); for(const a of getApplicableAddons(cfg,q.service)){ const n=num(q.addOns[a.id]); if(n>0) out.push(a.name+(a.pricingType==='each'&&n>1?` ×${n}`:'')); } if(q.service==='postConstruction') for(const [k,on] of Object.entries(q.pc.options)) if(on) out.push(L.pcopt[k]); return out; }
function renderSummary(q){ const L=t(), rows=[[L.sum.type, L.services[q.service][0]]];
  if(q.service==='postConstruction'||q.service==='commercial') rows.push([L.sum.size, `${Number(q.exactSqFt).toLocaleString()} ${L.sqft}`]); else rows.push([L.sum.size, (q.tierIndex==='over'?`${Number(q.exactSqFt).toLocaleString()}`:TIER_LABELS[q.tierIndex])+' '+L.sqft]);
  if(q.service==='standard') rows.push([L.sum.freq, L.freq[q.frequency][0]]); if(q.service==='commercial') rows.push([L.sum.freq, `${q.commercial.visitsPerWeek}× ${L.perWeek}`]); if(q.service==='moveInOut') rows.push([L.sum.type, L.move[q.moveType][0]]);
  if(q.service==='postConstruction'){ rows.push([L.sum.phase, L.phase[q.pc.phase][0]]); rows.push([L.sum.condition, L.pcond[q.pc.condition][0]]); } else rows.push([L.sum.condition, L.cond[q.condition][0]]);
  const s = serviceLines(q); rows.push([L.sum.services, s.length?s.join(', '):L.sum.none]); rows.push([L.sum.location, STATES[q.state]+(q.market?`, ${q.market}`:'')]);
  return `<div class="summary"><dl>${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>`; }
function renderResult(){ const L=t(), r=S.result, q=S.q; if(!r) return '';
  if(r.status==='customQuote'||r.status==='review'){ return `<div class="custom"><h2>${L.customTitle}</h2><p>${L.customBody}</p><div class="callout">${(r.reasons||[]).map(x=>esc(L.reasons[x]||x)).join(' ')}</div>${S.sent?`<p style="margin-top:14px;font-weight:600;color:var(--ok)">${L.sent}</p>`:`<form data-form="custom" class="field"><div class="field"><label for="cn">${L.name}</label><input id="cn" class="input" required></div><div class="field"><label for="cp">${L.phone}</label><input id="cp" class="input" type="tel" required></div><div class="field"><label for="ce">${L.email}</label><input id="ce" class="input" type="email"></div><button class="btn btn-primary" type="submit" style="margin-top:12px">${L.send}</button></form>`}${r.allowEstimate?`<p style="margin-top:12px"><button type="button" class="btn btn-ghost btn-sm" data-action="allowEstimate">${L.orEstimate}</button></p>`:''}</div>${renderSummary(q)}`; }
  const per = r.unit==='visit'?L.perVisit:L.perJob, show = cfg.tierWording.showPercentages;
  const card = (k,amt,cls) => `<div class="pcard ${cls}">${k==='recommended'?`<span class="tag">${L.bestValue}</span>`:''}<div class="tier">${L.tiers[k][0]}</div><div class="name">${L.tiers[k][1]}${show&&k==='low'?` · ${L.pctLow}`:''}${show&&k==='premium'?` · ${L.pctPrem}`:''}</div><div class="amt">${money(amt)}</div><div class="unit">${per}${r.monthly?`<br>${L.perMonth.replace('{a}',money(r.monthly[k]))}`:''}</div></div>`;
  return `<div class="q">${L.resultTitle}</div><div class="cards">${card('low',r.low,'low')}${card('recommended',r.recommended,'rec')}${card('premium',r.premium,'prem')}</div>${renderSummary(q)}<p class="note">${L.resultNote}</p>`; }

/* ---------------------------------------------------------------- 5. ADMIN / DEBUG (hidden; open with #admin) */
function renderAdmin(){ const L=t().admin, r=S.result, d=r&&r.debug; let calc='';
  if(d){ const rows=[['Base company price',money(d.basePrice),d.tier||(d.ratePerSqFt?`$${d.ratePerSqFt}/sq ft`:'')],['Over 5,000 sq ft',d.over5000?money(d.over5000):null],['State adjustment',money(d.geoAdjustment),`state ×${d.stateFactor} · market ×${d.marketFactor}`],['Condition adjustment',money(d.conditionAdjustment),`×${d.conditionFactor}`],['Phase factor',d.phaseFactor?`×${d.phaseFactor}`:null],['Service price',money(d.servicePrice)],['Window adjustment',d.windows.amount?money(d.windows.amount):null,d.windows.method==='percent'?`${(d.windows.percent*100).toFixed(0)}% package`:d.windows.method==='perWindow'?`${d.windows.count} × $${d.windows.unit}`:''],['Carpet calculation',d.carpet.recommended?money(d.carpet.recommended):null,d.carpet.method==='sqft'?`${d.carpet.sqft} carpet sq ft · low ${money(d.carpet.low)} / premium ${money(d.carpet.premium)}`:d.carpet.method],...(d.pcOptions||[]).map(o=>['Option — '+o.id,money(o.amount)]),...d.addons.lines.map(l=>['Add-on — '+l.name+(l.qty>1?` ×${l.qty}`:''),money(l.amount)]),['Profitability floor',money(d.profitabilityFloor),d.floorApplied?'APPLIED':'not binding'],['Estimated labor hours',String(d.laborHours)],['Effective price / sq ft','$'+d.effectivePerSqFt]].filter(x=>x[1]!=null);
    calc = `<table class="dbg"><tbody>${rows.map(([k,v,n])=>`<tr><td>${esc(k)}${n?`<span class="n">${esc(n)}</span>`:''}</td><td>${esc(v)}</td></tr>`).join('')}<tr class="t"><td>Recommended</td><td>${money(d.recommended)}</td></tr><tr><td>Low (× ${cfg.pricingTiers.low})</td><td>${money(d.low)}</td></tr><tr><td>Premium (× ${cfg.pricingTiers.premium})</td><td>${money(d.premium)}</td></tr></tbody></table>`; }
  else if(r) calc = `<p class="small muted">Status: ${r.status} — ${(r.reasons||r.errors||[]).join(', ')}</p>`; else calc = '<p class="small muted">Complete a quote to see the calculation.</p>';
  const c = S.cfgDraft || (S.cfgDraft = clone(cfg)); const n = (path,o={}) => { const v = path.split('.').reduce((a,k)=>a?.[k],c); return `<input class="input" type="number" step="${o.step??0.01}" value="${typeof v==='number'?(o.pct?Math.round(v*10000)/100:v):''}" data-cfg="${path}"${o.pct?' data-pct="1"':''} aria-label="${path}">`; };
  const tbl = (head,rows) => `<table class="cfg">${head?`<thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>`:''}<tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  const tabs = { calc:'Calculation', pricing:'Base pricing', factors:'State & market', options:'Windows, carpet, add-ons', pc:'Post-construction & commercial', floor:'Profitability & rounding', json:'JSON' };
  let body='';
  if(S.adminTab==='calc') body = calc;
  if(S.adminTab==='pricing') body = tbl(['Tier','Initial','Weekly','Bi-Weekly','Monthly','Deep','Move-Out'],TIER_LABELS.map((l,i)=>[l,n(`standardPricing.initial.${i}`,{step:1}),n(`standardPricing.weekly.${i}`,{step:1}),n(`standardPricing.biWeekly.${i}`,{step:1}),n(`standardPricing.monthly.${i}`,{step:1}),n(`deepPricing.${i}`,{step:1}),n(`moveOutPricing.${i}`,{step:1})])) + '<br>' + tbl(null,[['Move-in factor (× move-out table)',n('moveInFactor')],['Over 5,000: $/extra sq ft — initial / weekly / bi-weekly / monthly / deep / move-out',`<span class="row">${['initial','weekly','biWeekly','monthly','deep','moveOut'].map(k=>n('over5000.ratePerExtraSqFt.'+k,{step:.005})).join('')}</span>`],['Custom quote above (sq ft)',n('over5000.customQuoteAboveSqFt',{step:100})],['Low tier × / Premium tier ×',`<span class="row">${n('pricingTiers.low')}${n('pricingTiers.premium')}</span>`],['Show "20% less / 15% more" wording','<label class="row"><input type="checkbox" data-cfgbool="tierWording.showPercentages"'+(c.tierWording.showPercentages?' checked':'')+'> enabled</label>'],...Object.keys(c.services).map(s=>[`Service active — ${s}`,'<label class="row"><input type="checkbox" data-cfgbool="services.'+s+'.active"'+(c.services[s].active?' checked':'')+'> active</label>'])]);
  if(S.adminTab==='factors') body = tbl(null,[['Base market (state)',`<select class="select" data-cfgsel="baseMarket">${Object.keys(STATES).map(k=>`<option value="${k}"${c.baseMarket===k?' selected':''}>${STATES[k]}</option>`).join('')}</select>`],['Default city / market factor',n('marketFactors.default',{step:.01})],['Condition — normal / moderate / heavy / very heavy',`<span class="row">${['normal','moderate','heavy','veryHeavy'].map(k=>n('conditionFactors.'+k,{step:.05})).join('')}</span>`]]) + '<br>' + tbl(['State','Factor','Normalized to base market'],Object.keys(STATES).map(k=>[STATES[k],n('stateFactors.'+k,{step:.001}),`<span class="muted">×${calculateStateFactor(c,k)}</span>`]));
  if(S.adminTab==='options') body = tbl(null,[['Window model',`<select class="select" data-cfgsel="windowPricing.mode"><option value="percent"${c.windowPricing.mode==='percent'?' selected':''}>Package % of service price</option><option value="perWindow"${c.windowPricing.mode==='perWindow'?' selected':''}>Per window</option></select>`],['Window package %',n('windowPricing.packagePercent',{pct:1})],['Per window — interior / interior + exterior',`<span class="row">${n('windowPricing.perWindow.interior',{step:1})}${n('windowPricing.perWindow.interiorExterior',{step:1})}</span>`],['Second-floor access factor',n('windowPricing.accessibility.secondFloor',{step:.05})],['Carpet model',`<select class="select" data-cfgsel="carpetPricing.mode"><option value="sqft"${c.carpetPricing.mode==='sqft'?' selected':''}>By carpet sq ft</option><option value="perRoom"${c.carpetPricing.mode==='perRoom'?' selected':''}>Per room / hallway / stairs</option></select>`],['Carpet $/sq ft — low / recommended / premium',`<span class="row">${['low','recommended','premium'].map(k=>n('carpetPricing.ratePerSqFt.'+k,{step:.01})).join('')}</span>`],['Carpet minimum ($) · heavy soil × · pet odor ×',`<span class="row">${n('carpetPricing.minimum',{step:5})}${n('carpetPricing.conditionFactors.heavySoil',{step:.05})}${n('carpetPricing.conditionFactors.petOdor',{step:.05})}</span>`],['Per-room — room / hallway / landing / stair',`<span class="row">${['room','hallway','landing','stairs'].map(k=>n('carpetPricing.perRoom.'+k,{step:1})).join('')}</span>`]]) + '<br>' + tbl(['Add-on','Price','Type','Services','Active'],c.addOns.map((a,i)=>[a.name,n(`addOns.${i}.price`,{step:1}),a.pricingType,a.applicableServices.join(', ')||'—','<input type="checkbox" data-cfgbool="addOns.'+i+'.active"'+(a.active?' checked':'')+'>']));
  if(S.adminTab==='pc') body = tbl(null,[['Residential $/sq ft · minimum',`<span class="row">${n('postConstructionPricing.residentialRatePerSqFt')}${n('postConstructionPricing.residentialMinimum',{step:25})}</span>`],['Commercial tiers $/sq ft (<5k, <10k, <25k, <50k, <100k, 100k+)',`<span class="row">${c.postConstructionPricing.commercialTiers.map((_,i)=>n(`postConstructionPricing.commercialTiers.${i}.1`)).join('')}</span>`],['Commercial minimum',n('postConstructionPricing.commercialMinimum',{step:25})],['Phase — final / touch-up / multi-phase',`<span class="row">${['final','finalTouchUp','multiPhase'].map(k=>n('postConstructionPricing.phaseFactors.'+k)).join('')}</span>`],['Condition — light / normal / heavy / residue',`<span class="row">${['lightDust','normalDust','heavyDust','heavyResidue'].map(k=>n('postConstructionPricing.conditionFactors.'+k,{step:.05})).join('')}</span>`],...Object.entries(c.postConstructionPricing.options).map(([k,o])=>[`Option — ${k} (${o.type})`,n(`postConstructionPricing.options.${k}.value`,{step:o.type==='percent'?.01:1})]),['Custom quote — residential / commercial max sq ft',`<span class="row">${n('postConstructionPricing.customQuote.residentialMaxSqFt',{step:500})}${n('postConstructionPricing.customQuote.commercialMaxSqFt',{step:5000})}</span>`],['Commercial $/sq ft per visit — 1× / 2× / 3× / 5×',`<span class="row">${['1','2','3','5'].map(k=>n('commercialPricing.ratePerSqFtPerVisit.'+k,{step:.001})).join('')}</span>`],['Commercial minimum visit · custom quote above sq ft',`<span class="row">${n('commercialPricing.minimumVisitPrice',{step:5})}${n('commercialPricing.customQuoteAboveSqFt',{step:1000})}</span>`]]);
  if(S.adminTab==='floor') body = tbl(null,[['Minimum job price',n('profitability.minimumJobPrice',{step:5})],['Minimum hourly revenue',n('profitability.minimumHourlyRevenue',{step:1})],['Labor cost / hour',n('profitability.laborCostPerHour',{step:.5})],['Overhead %',n('profitability.overheadPercent',{pct:1})],['Target margin %',n('profitability.targetMargin',{pct:1})],['Minimum post-construction price',n('profitability.minimumPostConstructionPrice',{step:25})],['Minimum commercial visit',n('profitability.minimumCommercialVisit',{step:5})],['Production sq ft / hour — standard / initial / deep / move / PC res / PC com / commercial',`<span class="row">${['standard','initial','deep','moveInOut','postConstructionResidential','postConstructionCommercial','commercial'].map(k=>n('profitability.productionSqFtPerHour.'+k,{step:10})).join('')}</span>`],['Rounding step ($)',n('rounding.step',{step:1})],['Exact pricing (no rounding)','<label class="row"><input type="checkbox" data-cfgbool="rounding.exactPricing"'+(c.rounding.exactPricing?' checked':'')+'> enabled</label>']]);
  if(S.adminTab==='json') body = `<textarea class="input json" data-cfgjson="1" spellcheck="false">${esc(S.cfgJson||JSON.stringify(c,jsonOut,2))}</textarea><div class="row" style="margin-top:8px"><button type="button" class="btn btn-sm" data-action="applyJson">Apply JSON to draft</button></div>`;
  return `<section class="admin"><div class="adm-h"><div><h2>${L.title}</h2><p class="small muted">${L.hide}</p></div><div class="row">${S.adminMsg?`<span class="small" style="color:var(--ok)">${esc(S.adminMsg)}</span>`:''}<button type="button" class="btn btn-sm" data-action="resetCfg">${L.reset}</button><button type="button" class="btn btn-sm btn-primary" data-action="saveCfg">${L.save}</button><button type="button" class="btn btn-sm btn-ghost" data-action="closeAdmin">${L.close}</button></div></div><div class="tabs">${Object.entries(tabs).map(([k,l])=>`<button type="button" aria-current="${S.adminTab===k}" data-action="adminTab" data-tab="${k}">${l}</button>`).join('')}</div><div class="panel"><div class="pb">${body}</div></div></section>`; }

/* ---------------------------------------------------------------- 6. RENDER & EVENTS */
const app = document.getElementById('app');
function render(){ const L=t(); document.getElementById('brand-sub').textContent = L.sub; document.documentElement.lang = S.lang; document.querySelectorAll('.lang').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===S.lang));
  if(!S.q) S.q = newQuote(); const sc = screens(S.q), key = sc[Math.min(S.step,sc.length-1)], isResult = key==='result', errs = S.errors.map(e=>L.errs[e]).filter(Boolean);
  app.innerHTML = `<div class="progress"><span>${L.progress.replace('{n}',S.step+1).replace('{t}',sc.length)}</span><span class="bar"><i style="width:${(S.step+1)/sc.length*100}%"></i></span></div>${errs.length?`<div class="err" role="alert" aria-live="assertive">${errs.map(esc).join(' ')}</div>`:''}<div data-screen="${key}">${renderScreen(key)}</div>${S.admin?renderAdmin():''}
<div class="nav"><div class="nav-in">${S.step>0?`<button type="button" class="btn btn-ghost" data-action="back">${L.back}</button>`:''}${isResult?`<button type="button" class="btn btn-primary" data-action="restart">${L.startOver}</button>`:key==='service'?'':`<button type="button" class="btn btn-primary" data-action="next">${sc[S.step+1]==='result'?L.getPrice:L.next}</button>`}</div></div>`;
  window.scrollTo({top:0}); }
const getP = (o,p) => p.split('.').reduce((a,k)=>a?.[k],o); function setP(o,p,v){ const ks=p.split('.'); let c=o; for(let i=0;i<ks.length-1;i++){ if(c[ks[i]]==null) c[ks[i]]={}; c=c[ks[i]]; } c[ks[ks.length-1]]=v; }
function next(){ const sc = screens(S.q), key = sc[S.step]; const need = { size:['sqft','exactSqFt'], sizeExact:['sqft'], frequency:['frequency'], moveType:['moveType'], condition:['condition'], commercialFrequency:['frequency'], projectType:['projectType'], phase:['phase'], pcCondition:['condition'], addons:['carpetSqFt','windowCount'], location:['state'] }[key]||[];
  const all = validateQuote(cfg,S.q), errs = all.filter(e=>need.includes(e)); if(errs.length){ S.errors=errs; render(); return; } S.errors=[];
  if(sc[S.step+1]==='result'){ if(all.length){ S.errors=all; render(); return; } S.result = calculateQuote(cfg,S.q); S.sent=false; }
  S.step++; render(); }
document.addEventListener('click', e => {
  const lang = e.target.closest('[data-lang]'); if(lang){ S.lang = lang.dataset.lang; render(); return; }
  const set = e.target.closest('[data-set]'); if(set){ const p = set.dataset.set, v = set.dataset.value; if(v==='toggle') setP(S.q,p,!getP(S.q,p)); else { const cur = getP(S.q,p); setP(S.q,p, (/^\d+$/.test(v)&&p!=='tierIndex')?Number(v):v); if(p==='service' && cur!==v){ const svc = v; S.q = newQuote(); S.q.service = svc; } }
    S.errors=[]; if(set.dataset.stay||v==='toggle'||p==='tierIndex'||p.startsWith('pc.options')) render(); else next(); return; }
  const a = e.target.closest('[data-action]'); if(!a) return;
  switch(a.dataset.action){
    case 'next': next(); break; case 'back': S.errors=[]; S.step=Math.max(0,S.step-1); render(); break;
    case 'restart': S.q=newQuote(); S.step=0; S.result=null; S.errors=[]; render(); break;
    case 'allowEstimate': S.q.allowLargeEstimate=true; S.result=calculateQuote(cfg,S.q); render(); break;
    case 'adminTab': S.adminTab=a.dataset.tab; S.adminMsg=''; render(); break;
    case 'closeAdmin': S.admin=false; history.replaceState(null,'',location.pathname+location.search); render(); break;
    case 'saveCfg': saveCompanyConfig(S.cfgDraft); cfg=loadCompanyConfig('default'); S.cfgDraft=clone(cfg); S.cfgJson=''; if(S.result&&S.result.summary) S.result=calculateQuote(cfg,S.q); S.adminMsg=t().admin.saved; render(); break;
    case 'resetCfg': if(confirm('Reset pricing settings to defaults?')){ safeDel('oneapp.pricingConfig.default'); cfg=loadCompanyConfig('default'); S.cfgDraft=clone(cfg); S.cfgJson=''; if(S.result) S.result=calculateQuote(cfg,S.q); render(); } break;
    case 'applyJson': try{ S.cfgDraft = JSON.parse(S.cfgJson||document.querySelector('[data-cfgjson]').value, jsonIn); S.cfgJson=''; S.adminMsg='JSON applied to draft — save to persist.'; }catch(err){ S.adminMsg='JSON could not be parsed.'; } render(); break; }
});
document.addEventListener('input', e => { const el = e.target;
  if(el.dataset.num){ const v = el.value===''?'':Number(el.value); if(el.dataset.num.startsWith('addOns.')) setP(S.q, el.dataset.num, Math.max(1,num(v,1))); else setP(S.q, el.dataset.num, v); return; }
  if(el.dataset.text){ setP(S.q, el.dataset.text, el.value); return; }
  if(el.dataset.cfg){ const n = el.value===''?0:Number(el.value); setP(S.cfgDraft, el.dataset.cfg, Number.isFinite(n)?(el.dataset.pct?n/100:n):0); return; }
  if(el.dataset.cfgjson) S.cfgJson = el.value; });
document.addEventListener('change', e => { const el = e.target;
  if(el.dataset.sel){ setP(S.q, el.dataset.sel, el.value); return; }
  if(el.dataset.cfgsel){ setP(S.cfgDraft, el.dataset.cfgsel, el.value); render(); return; }
  if(el.dataset.cfgbool){ setP(S.cfgDraft, el.dataset.cfgbool, el.checked); return; } });
document.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.matches('input[data-num], input[data-text]') && !S.admin){ e.preventDefault(); next(); } });
document.addEventListener('submit', e => { if(e.target.dataset.form==='custom'){ e.preventDefault(); S.sent=true; /* hook: send {name, phone, email, quote: S.q} to One App CRM / GHL */ render(); } });
window.addEventListener('hashchange', () => { S.admin = location.hash==='#admin'; render(); });
render();
